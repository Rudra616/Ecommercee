{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>MyShop</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />

    <!-- Font Awesome -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css" rel="stylesheet" />

    <!-- Custom Styles -->
    <link rel="stylesheet" href="{% static 'css/ecom.css' %}" />
</head>
<body>

    <!-- Navbar -->
    <header class="container-fluid navbar-light bg-light">
        <nav class="navbar navbar-expand-lg navbar-light bg-light fixed-top">
            <div class="container d-flex justify-content-between align-items-center">
                <a class="navbar-brand font-weight-bold" href="{% url 'second' %}">
                    <i class="fa-solid fa-store text-primary"></i> MyShop
                </a>

                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarSupportedContent">
                    <span class="navbar-toggler-icon"></span>
                </button>

                <div class="collapse navbar-collapse" id="navbarSupportedContent">
                    <ul class="navbar-nav ms-auto align-items-center">
                        <li class="nav-item mx-2"><a class="nav-link" href="{% url 'second' %}">Home</a></li>
                        <li class="nav-item mx-2"><a class="nav-link" href="{% url 'order_history' %}">Orders</a></li>

                        {% if session %}
                        <li class="nav-item mx-2">
                            <a class="nav-link text-danger fw-bold" href="{% url 'logout' %}">Logout</a>
                        </li>
                        {% else %}
                        <li class="nav-item mx-2">
                            <a class="nav-link text-success fw-bold" href="{% url 'login' %}">Login</a>
                        </li>
                        {% endif %}

                        <li class="nav-item dropdown mx-2">
                            <a class="nav-link dropdown-toggle" href="#" data-bs-toggle="dropdown">Products</a>
                            <ul class="dropdown-menu">
                                <li><a class="dropdown-item" href="{% url 'add_product' %}">Add Product</a></li>
                                <li><a class="dropdown-item" href="{% url 'product_list' %}">Product List</a></li>
                            </ul>
                        </li>

                        <li class="nav-item mx-2">
                            <a class="nav-link" href="{% url 'cartdata' %}"><i class="fa fa-shopping-cart"></i></a>
                        </li>
                        <li class="nav-item mx-2">
                            <a class="nav-link" href="{% url 'profile' %}"><i class="far fa-user"></i></a>
                        </li>
                    </ul>
                </div>

                <!-- Search Bar -->
                <li class="nav-item mx-3 d-flex align-items-center">
                    <form class="form-inline w-100" action="{% url 'product_search' %}" method="GET">
                        <div class="input-group">
                            <input class="form-control" name="q" type="text" placeholder="Search products..." required />
                            <button type="submit" class="btn btn-outline-primary">
                                <i class="fa fa-search"></i>
                            </button>
                        </div>
                    </form>
                </li>
            </div>
        </nav>
    </header>

    <!-- Page Content -->
    {% block content %}
    {% endblock %}

    <!-- Bootstrap Bundle JS (deferred) -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js" defer></script>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js" defer></script>
</body>
</html>
