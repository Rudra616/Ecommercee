{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile Page</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <style>
        body {
            font-family: 'Roboto', sans-serif;
            background: #eeeeee;
        }

        .profile-container {
            position: relative;
            max-width: 700px;
            margin: 50px auto;
        }

        .back-home {
            position: absolute;
            top: -40px;
            left: -10px;
        }

        .back-home img {
            width: 40px;
            cursor: pointer;
        }

        .profile-card {
            background: white;
            border-radius: 15px;
            padding: 20px;
            box-shadow: 0px 4px 8px rgba(0, 0, 0, 0.2);
            position: relative;
        }

        .profile-header {
            text-align: center;
            padding: 20px;
            background: #6200ea;
            color: white;
            border-top-left-radius: 15px;
            border-top-right-radius: 15px;
        }

        .profile-header img {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            object-fit: cover;
            border: 4px solid white;
        }

        @media (max-width: 768px) {
            .profile-container {
                padding: 15px;
            }

            .back-home {
                top: -30px;
                left: 0;
            }
        }
    </style>
</head>

<body>
    <div class="profile-container">
        <!-- Back to Home Button -->
        <a href="{% url 'second' %}" class="back-home">
            <img src="{% static 'images/home-icon.png' %}" alt="Back to Home">
        </a>

        <div class="profile-card">
            <div class="profile-header">
                <img src="https://img.icons8.com/bubbles/100/000000/user.png" alt="User Profile">
                <h4>{{ user.name }}</h4>
            </div>
            <div class="p-3">
                <form method="post">
                    {% csrf_token %}
                    <div class="mb-3">
                        <label>Email</label>
                        <input type="email" name="email" class="form-control" value="{{ user.email }}">
                    </div>
                    <div class="mb-3">
                        <label>Phone</label>
                        <input type="text" name="mob" class="form-control" value="{{ user.mob }}">
                    </div>
                    <div class="mb-3">
                        <label>Address</label>
                        <textarea name="add" class="form-control">{{ user.add }}</textarea>
                    </div>
                    <div class="mb-3">
                        <label>Password</label>
                        <input type="password" name="password" class="form-control" value="{{ user.password }}">
                    </div>
                    <button type="submit" class="btn btn-primary w-100">Update</button>
                </form>
            </div>
        </div>
    </div>
</body>

</html>
